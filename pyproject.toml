[project]
name = "atom"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "apscheduler<4",
    "cron-descriptor>=2.2.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "trafilatura>=2.3.1",
    "tzlocal>=5.4.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
